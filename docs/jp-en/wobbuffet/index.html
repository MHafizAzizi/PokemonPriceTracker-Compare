*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font)}

.rail{position:sticky;top:0;height:100vh;padding:40px 28px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:28px}

#eras{margin-top:40px}

/* JP vs EN mock (2026-11-10): the market report's facet rail + a gap bar centred on 1x + a detail drawer */
:root { --en: #2f6fde; --jptcg: #c2410c; --merc: #1d7a3a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --en: #6b9cff; --jptcg: #f08a4b; --merc: #7fd39a; } }
:root[data-theme="dark"] { --en: #6b9cff; --jptcg: #f08a4b; --merc: #7fd39a; }
.cur { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.cur button { border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 4px 12px; font-size: 13px; border-radius: 6px; }
.cur button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.fxn { font: 11px var(--mono); color: var(--muted); margin-left: 4px; }
.jsum { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 20px; align-items: center; margin-bottom: 20px; }
.jsum .big { font: 600 26px var(--font); }
.jsum .big span { font-size: 14px; color: var(--muted); font-weight: 400; }
.jsum .med { font: 13px var(--mono); color: var(--muted); margin-top: 4px; }
.jt td { vertical-align: middle; }
.jt .card { display: flex; gap: 10px; align-items: center; min-width: 0; }
.jt .card .t { display: grid; min-width: 0; }
.jt .card .t b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jt .card .t span { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jt tr.row { cursor: pointer; }
.jt tr.row:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.jt tr.row[aria-selected="true"] td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.jt td:first-child { min-width: 220px; }
.jt .card .t .mp { display: none; }
.jt .jset { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 13px var(--mono); }
.jt .jset img { height: 14px; width: auto; max-width: 40px; object-fit: contain; vertical-align: -2px; margin-right: 6px; }
.jt .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.jt .num small { color: var(--muted); }
.gapc { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.gbar { position: relative; width: 120px; height: 8px; background: var(--line); border-radius: 4px; flex: none; }
.gbar::after { content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.gbar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.gx { font: 13px var(--mono); width: 52px; text-align: right; }
.vb { font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }

.flags { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; white-space: normal; max-width: 180px; }
/* detail drawer: shut until a card is picked */
.jdet { position: fixed; top: 0; right: 0; bottom: 0; width: min(100vw, 420px); z-index: 35; background: var(--surface); border-left: 1px solid var(--line); box-shadow: -10px 0 40px #0003; overflow: auto; padding: 16px 20px 32px; }
.jdet .top { display: flex; justify-content: space-between; align-items: center; font: 12px var(--mono); color: var(--muted); text-transform: uppercase; }
.jdet .scans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.jdet figure { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }
.jdet figure img, .jdet .noscan { width: 100%; height: auto; aspect-ratio: 63 / 88; object-fit: cover; border-radius: 6px; background: var(--line); display: grid; place-items: center; }
.jdet h2 { margin: 6px 0 2px; font-size: 18px; }
.jdet .en { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.jdet .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.jdet .tile { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; }
.jdet .tile b { font: 600 16px var(--mono); }
.jdet .tile span { font-size: 11px; color: var(--muted); }
.jdet h3 { font-size: 13px; margin: 16px 0 6px; }
.jdet svg { width: 100%; height: auto; }
.jdet svg text { font: 10px var(--mono); fill: var(--muted); }
.jdet .jlg { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.jdet .jlg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.jdet table { width: 100%; border-collapse: collapse; font-size: 13px; }
.jdet table th, .jdet table td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; }
.jdet table .n { text-align: right; font-variant-numeric: tabular-nums; }
.jdet .links a { display: inline-block; margin: 0 12px 6px 0; color: var(--accent); }
@media (max-width: 900px) {
  .jsum { grid-template-columns: 1fr; }
  .jt .hs { display: none; }
  .gbar { display: none; }
  .jt .card .t { min-width: 0; }

.tw { overflow-x: auto; }

const MF = new Intl.DateTimeFormat('en-US', { month: 'short', year: '2-digit', timeZone: 'UTC' });
const fmt = v => (v == null ? '–' : NF[cur].format(v));
const mon = m => MF.format(new Date(m + '-01T00:00:00Z'));
const lastFx = Object.values(D.fx).filter(Boolean).at(-1), fxOf = m => D.fx[m] || lastFx;
const usd = v => (v == null ? null : cur === 'usd' ? v : v / lastFx);          // a USD amount in the chosen currency
const yen = v => (v == null ? null : cur === 'jpy' ? v : v * lastFx);          // a JPY amount in the chosen currency
const thumb = s => (!s ? '' : s.startsWith('http') ? s : DOCS + 'thumbs/' + s + '.jpg');
const ERA_ORDER = ['Base', 'Gym', 'Neo', 'Legendary Collection', 'e-Card', 'EX', 'Diamond & Pearl', 'Platinum', 'HeartGold & SoulSilver', 'Black & White', 'XY', 'Sun & Moon', 'Sword & Shield', 'Scarlet & Violet', 'Mega Evolution'];
const eraIx = e => { const i = ERA_ORDER.indexOf(e); return i < 0 ? 99 : i; };
// verdict: Mercari (or JP TCGplayer) price ÷ EN, as the old page: < 0.8 cheaper in Japan, > 1.25 dearer
const V = [['cheap', 'Cheaper in JP', 'var(--best-text)'], ['same', 'About the same', 'var(--accent)'], ['dear', 'Dearer in JP', 'var(--danger)'], ['none', 'No comparison', 'var(--line)']];
const verdictOf = c => (c.gap_all == null ? 'none' : c.gap_all < 0.8 ? 'cheap' : c.gap_all > 1.25 ? 'dear' : 'same');
const why = c => (!c.en_id ? 'Japan-only print' : c.en_usd_last == null ? 'No EN price' : 'No Japan sales');
const flagsOf = c => [c.mercari_sold_all_jpy <= 350 && c.en_usd_last < 1 && '¥300 floor', c.mercari_sold_n < 5 && 'Thin data (< 5 sales)', (c.mercari_tier === 'setname' || c.mercari_tier === 'card') && 'Name + set match'].filter(Boolean);
const RA = D.cards.map(c => ({ ...c, verdict: verdictOf(c), flags: flagsOf(c), setk: c.en_set || c.jp_set || 'Japan-only' }));

// ---------- filters ----------
const FK = ['verdict', 'era', 'setk', 'rarity', 'flags'];
const F = { q: '' }; FK.forEach(k => { F[k] = []; });
const getv = { verdict: c => c.verdict, era: c => c.era, setk: c => c.setk, rarity: c => c.rarity, flags: c => (c.flags.length ? c.flags : ['No flags']) };
const hit = (c, k) => !F[k].length || [].concat(getv[k](c)).some(v => F[k].includes(v));
const match = (c, skip) => FK.every(k => k === skip || hit(c, k))
  && (!F.q || [c.title, c.en_name, c.en_set, c.jp_set, c.code, c.en_no].join(' ').toLowerCase().includes(F.q));
const rowsBut = skip => RA.filter(c => match(c, skip));
let UI = { open: { verdict: true, era: true } };
try { UI = { ...UI, ...JSON.parse(localStorage.getItem('cpt-jpen-ui') || '{}') }; } catch (e) { /* fine */ }
const saveUI = () => { try { localStorage.setItem('cpt-jpen-ui', JSON.stringify(UI)); } catch (e) { /* fine */ } };
const FACETS = [
  ['verdict', 'Verdict', (a, b) => V.findIndex(v => v[0] === a) - V.findIndex(v => v[0] === b), v => (V.find(x => x[0] === v) || [v, v])[1]],
  ['era', 'Era', (a, b) => eraIx(a) - eraIx(b), v => v],
  ['setk', 'Set', null, v => v],
  ['rarity', 'Rarity', null, v => v],
  ['flags', 'Data quality', null, v => v],
];
function facet([key, label, order, lab]) {
  const m = new Map(); rowsBut(key).forEach(c => [].concat(getv[key](c)).forEach(v => { if (v) m.set(v, (m.get(v) || 0) + 1); }));
  const cur0 = F[key];
  const vals = [...new Set([...m.keys(), ...cur0])].sort(order || ((a, b) => (m.get(b) || 0) - (m.get(a) || 0) || String(a).localeCompare(b)));
  if (!vals.length) return '';
  return `<details class="facet" data-k="${key}"${UI.open[key] ? ' open' : ''}><summary>${label}${cur0.length ? `<span class="on">${cur0.length}</span>` : ''}<small>${vals.length}</small></summary>
    ${vals.length > 12 ? `<input type="search" class="fq" placeholder="Search ${label.toLowerCase()}…" aria-label="Search ${label}" autocomplete="off">` : ''}
    <div class="fl" role="group" aria-label="${label}">${vals.map(v => { const k = m.get(v) || 0;
      return `<label class="fo${k ? '' : ' zero'}"><input type="checkbox" data-k="${key}" data-v="${esc(v)}"${cur0.includes(v) ? ' checked' : ''}>${key === 'verdict' ? `<i class="sw" style="background:${(V.find(x => x[0] === v) || [])[2]}"></i>` : ''}<span>${esc(lab(v))}</span><small>${n(k)}</small></label>`; }).join('')}</div>
    ${cur0.length ? `<button type="button" class="linkish" data-clear="${key}">Clear</button>` : ''}</details>`;
}
function drawRail() {
  const nOn = FK.filter(k => F[k].length).length;
  $('facets').innerHTML = `<div class="fh"><h2>Filters</h2>${nOn || F.q ? '<button type="button" class="linkish" data-reset>Reset all</button>' : ''}</div>${FACETS.map(facet).join('')}`;
  $('fopen').textContent = 'Filters' + (nOn ? ' · ' + nOn : '');
  document.querySelectorAll('[data-cur]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cur === cur));
}

// ---------- summary ----------
function drawSummary(rows) {
  const cnt = {}; V.forEach(v => { cnt[v[0]] = rows.filter(c => c.verdict === v[0]).length; });
  const cheap = rows.filter(c => c.verdict === 'cheap');
  const save = cheap.reduce((t, c) => t + (c.en_usd_last - c.mercari_sold_all_jpy * lastFx), 0);
  const gaps = rows.map(c => c.gap_all).filter(g => g != null).sort((a, b) => a - b);
  const med = gaps.length ? gaps[gaps.length >> 1] : null;
  $('summary').innerHTML = `<div class="jsum"><div><div class="big">${fmt(usd(save))} <span>saved buying the ${n(cheap.length)} cheaper prints in Japan</span></div>
      <div class="med">${med == null ? '' : `median Japan ÷ EN ${med.toFixed(2)}× · ${n(gaps.length)} prints compared`}</div></div>
    <div><div class="split">${V.map(v => cnt[v[0]] ? `<i style="width:${cnt[v[0]] / (rows.length || 1) * 100}%;background:${v[2]}" title="${v[1]} ${cnt[v[0]]}"></i>` : '').join('')}</div>
      <div class="legend">${V.map(v => `<button type="button" class="lg-b${F.verdict.includes(v[0]) ? ' on' : ''}" data-verdict="${v[0]}"${cnt[v[0]] ? '' : ' disabled'}><i style="background:${v[2]}"></i>${v[1]} <b>${n(cnt[v[0]])}</b></button>`).join('')}</div></div></div>`;
}

// ---------- table ----------
const st = { k: 'gap_all', d: 1, def: true };
const SK = { name: c => c.en_name || c.title, set: c => eraIx(c.era) * 1e4 + (c.code || c.setk).charCodeAt(0), en: c => c.en_usd_last, ebay: c => c.ebay_min_usd, sold: c => c.sold_usd, jp: c => c.mercari_sold_all_jpy, gap_all: c => c.gap_all, n: c => c.mercari_sold_n };
const cmp = (k, d) => (a, b) => { const x = SK[k](a), y = SK[k](b);
  if (x == null || y == null) return (x == null) - (y == null);   // no value stays last in both directions
  return d * (typeof x === 'string' ? x.localeCompare(y) : x - y) || String(a.title).localeCompare(b.title); };
const th = (k, label, cls = '') => { const on = st.k === k && !st.def;
  return `<th class="${cls}"${on ? ` aria-sort="${st.d > 0 ? 'ascending' : 'descending'}"` : ''}><button type="button" class="sh${on ? ' on' : ''}" data-k="${k}">${label}<span aria-hidden="true">${on ? (st.d > 0 ? '↑' : '↓') : '↕'}</span></button></th>`; };
// the gap as a bar centred on 1× (log scale, 0.1× .. 10×): green toward Japan, red away
const gapBar = g => { if (g == null) return '<span class="muted">–</span>';
  const p = Math.max(-1, Math.min(1, Math.log10(g))) * 50, cls = g < 0.8 ? 'var(--best-text)' : g > 1.25 ? 'var(--danger)' : 'var(--accent)';
  return `<span class="gapc"><span class="gbar" aria-hidden="true"><i style="${p < 0 ? `right:50%;width:${-p}%` : `left:50%;width:${p}%`};background:${cls}"></i></span><span class="gx" style="color:${cls}">${g.toFixed(2)}×</span></span>`; };
function drawTable(rows) {
  const sortName = st.def ? '' : { name: 'Card', set: 'Set', en: 'EN', ebay: 'eBay', sold: 'eBay sold', jp: 'Japan', gap_all: 'Japan ÷ EN', n: 'Sales' }[st.k];
  $('tbar').innerHTML = `<input type="search" id="q" placeholder="Search card, set…" aria-label="Search prints" value="${esc(F.q)}" autocomplete="off">
    <span class="cnt" aria-live="polite"><b>${n(rows.length)}</b> of ${n(RA.length)} prints</span><span class="sp"></span>
    ${sortName ? `<span class="ftag">Sort: ${sortName} ${st.d > 0 ? '↑' : '↓'}<button type="button" data-sortreset aria-label="Back to default order">×</button></span>` : ''}`;
  $('tHead').innerHTML = `<tr>${th('name', 'Card')}${th('set', 'Set', 'hs cs')}${th('en', 'EN on TCGplayer', 'r hs')}${th('ebay', 'eBay asking', 'r hs')}${th('sold', 'eBay sold', 'r hs')}${th('jp', 'Japan sold', 'r hs')}${th('gap_all', 'Japan ÷ EN', 'r')}<th class="hs">Verdict</th></tr>`;
  $('tBody').innerHTML = rows.slice().sort(cmp(st.k, st.d)).map(c => `<tr class="row" data-card="${esc(c.key)}" aria-selected="${c.key === sel}" tabindex="0">
      <td><span class="card">${c.img_jp ? `<img class="th" loading="lazy" width="30" height="42" alt="" src="${esc(thumb(c.img_jp))}">` : '<span class="th"></span>'}<span class="t"><b lang="ja" translate="no">${esc(c.title)}</b><span>${esc(c.en_name || why(c))}</span><span class="mp">EN ${fmt(usd(c.en_usd_last))} · JP ${fmt(yen(c.mercari_sold_all_jpy))}</span></span></span></td>
      <td class="jset hs cs" title="${esc(c.en_set || c.jp_set)}">${c.logo ? `<img alt="" loading="lazy" src="${esc(c.logo)}">` : ''}${esc(c.code || c.setk)} ${esc(c.en_no || '')}</td>
      <td class="num hs">${fmt(usd(c.en_usd_last))}</td>
      <td class="num hs" title="Cheapest Buy It Now incl. US shipping · median of ${c.ebay_n || 0} listings, ${esc(D.ebay_date || '')}">${fmt(usd(c.ebay_min_usd))}${c.ebay_n ? ` <small>(${n(c.ebay_n)})</small>` : ''}</td>
      <td class="num hs" title="Near Mint, 30-day median of eBay sales (PokeTrace), ${esc(D.sold_date || '')}${c.sold_variant ? ' · ' + esc(c.sold_variant) : ''}">${fmt(usd(c.sold_usd))}${c.sold_n ? ` <small>(${n(c.sold_n)})</small>` : ''}</td>
      <td class="num hs">${fmt(yen(c.mercari_sold_all_jpy))} <small>(${c.mercari_sold_n || 0})</small></td>
      <td class="num">${gapBar(c.gap_all)}</td>
      <td class="hs"><span class="vb ${c.verdict}">${c.verdict === 'none' ? esc(why(c)) : (V.find(v => v[0] === c.verdict) || [])[1]}</span>${c.flags.length ? `<span class="flags">${esc(c.flags.join(' · '))}</span>` : ''}</td></tr>`).join('')
    || '<tr><td colspan="8" class="muted">No prints match. <button type="button" class="linkish" data-reset>Reset filters</button></td></tr>';
}

// ---------- detail drawer ----------
const SERIES = [['en_usd', '--en', 'EN on TCGplayer'], ['jp_tcg_usd', '--jptcg', 'JP on TCGplayer'], ['mercari', '--merc', 'JP sold on Mercari']];
const val = (r, s) => (s === 'mercari' ? (r.mercari_jpy == null ? null : cur === 'jpy' ? r.mercari_jpy : r.mercari_usd) : r[s] == null ? null : cur === 'usd' ? r[s] : r[s] / fxOf(r.month));
function chart(c) {
  const rows = c.rows, W = 380, H = 200, L = 56, R = 8, T = 10, B = 24;
  const vals = rows.flatMap(r => SERIES.map(([s]) => val(r, s))).filter(v => v != null);
  if (!vals.length) return '<p class="muted">No monthly price data yet for this print.</p>';
  const max = Math.max(...vals) * 1.1 || 1, x = i => L + i * (W - L - R) / (rows.length - 1), y = v => T + (H - T - B) * (1 - v / max);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = max * k / 4; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; }
  rows.forEach((r, i) => { if (i % 3 === 0) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${mon(r.month)}</text>`; });
  for (const [s, color, label] of SERIES) {
    let d = '', pen = false;
    rows.forEach((r, i) => { const v = val(r, s); if (v == null) { pen = false; return; }
      d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; pen = true;
      g += `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(${color})"><title>${label} ${mon(r.month)}: ${fmt(v)}${s === 'mercari' ? ` (${r.n} sales)` : ''}</title></circle>`; });
    g += `<path d="${d}" fill="none" stroke="var(${color})" stroke-width="2"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly prices for ${esc(c.title)}">${g}</svg>`;
}
function drawDetail() {
  const det = $('det'), c = RA.find(x => x.key === sel);
  document.querySelectorAll('tr.row').forEach(r => r.setAttribute('aria-selected', r.dataset.card === sel));
  document.body.classList.toggle('detopen', !!c);   // desktop: the table makes room for the drawer
  if (!c) { det.hidden = true; return; }
  det.hidden = false;
  const fig = (s, label) => `<figure>${s ? `<img src="${esc(s)}" alt="${label} scan" loading="lazy">` : '<div class="noscan">No scan</div>'}<figcaption>${label}</figcaption></figure>`;
  const gx = g => (g == null ? '–' : g.toFixed(2) + '×');
  const merc = 'https://jp.mercari.com/search?' + new URLSearchParams({ keyword: c.title, status: 'sold_out' });
  const tcg = 'https://www.tcgplayer.com/search/pokemon/product?' + new URLSearchParams({ q: (c.en_name || '') + ' ' + (c.en_set || '') });
  det.innerHTML = `<div class="top"><span>Card</span><button type="button" class="linkish" data-close>Close</button></div>
    <div class="scans">${fig(c.hd_jp ? DOCS + 'jp-en/scans/' + c.hd_jp + '.webp' : thumb(c.img_jp), 'Japanese')}${c.en_id ? fig(thumb(c.img_en), 'English') : ''}</div>
    <h2 lang="ja" translate="no">${esc(c.title)}</h2>
    <div class="en">${c.en_id ? `vs ${esc(c.en_name)} · ${esc(c.en_set)} ${esc(c.en_no)}` : 'Japan-only print'}${c.jp_set ? `<br>JP set: ${esc(c.jp_set)}` : ''}</div>
    <span class="vb ${c.verdict}">${c.verdict === 'none' ? esc(why(c)) : (V.find(v => v[0] === c.verdict) || [])[1]}</span>${c.flags.length ? `<span class="flags">${esc(c.flags.join(' · '))}</span>` : ''}
    <div class="tiles"><div class="tile"><b>${fmt(usd(c.en_usd_last))}</b><span>EN on TCGplayer${c.en_usd_month ? ', ' + mon(c.en_usd_month) : ''}</span></div>
      <div class="tile"><b>${fmt(yen(c.mercari_sold_all_jpy))}</b><span>Japan sold median, ${c.mercari_sold_n || 0} sales</span></div>
      <div class="tile"><b>${fmt(usd(c.sold_usd))}</b><span>eBay sold, Near Mint 30-day median${c.sold_n ? `, ${n(c.sold_n)} sales` : ''}${c.sold_upd ? ', last ' + esc(c.sold_upd) : ''}</span></div>
      <div class="tile"><b>${c.ebay_url ? `<a href="${esc(c.ebay_url)}" target="_blank" rel="noopener">${fmt(usd(c.ebay_min_usd))}</a>` : fmt(usd(c.ebay_min_usd))}</b><span>eBay cheapest Buy It Now${c.ebay_n ? `, ${n(c.ebay_n)} listings, median ${fmt(usd(c.ebay_med_usd))}` : ''}${D.ebay_date ? ' (' + esc(D.ebay_date) + ')' : ''}</span></div>
      <div class="tile"><b>${gx(c.gap_mercari)}</b><span>Mercari ÷ EN, same month${c.gap_mercari_month ? ' (' + mon(c.gap_mercari_month) + ')' : ''}</span></div>
      <div class="tile"><b>${gx(c.gap_jp_tcg)}</b><span>JP TCGplayer ÷ EN${c.gap_jp_tcg_month ? ' (' + mon(c.gap_jp_tcg_month) + ')' : ''}</span></div></div>
    <h3>Price trend, 12 months</h3><div class="jlg">${SERIES.map(([, col, l]) => `<span><i style="background:var(${col})"></i>${l}</span>`).join('')}</div>${chart(c)}
    <h3>Last 6 months</h3><table><thead><tr><th>Month</th><th class="n">EN</th><th class="n">JP TCGplayer</th><th class="n">Mercari</th></tr></thead>
      <tbody>${c.rows.slice(-6).reverse().map(r => `<tr><th>${mon(r.month)}</th><td class="n">${fmt(val(r, 'en_usd'))}</td><td class="n">${fmt(val(r, 'jp_tcg_usd'))}</td><td class="n">${fmt(val(r, 'mercari'))} <small class="muted">(${r.n})</small></td></tr>`).join('')}</tbody></table>
    <h3>Links</h3><div class="links"><a href="${esc(merc)}" target="_blank" rel="noopener">Mercari sold ↗</a>${c.en_id ? `<a href="${esc(tcg)}" target="_blank" rel="noopener">TCGplayer ↗</a>` : ''}</div>`;
}

// ---------- draw + events ----------
const sync = () => { const p = new URLSearchParams(); if (cur === 'jpy') p.set('cur', 'jpy'); if (sel) p.set('card', sel); history.replaceState(null, '', p.toString() ? '?' + p : location.pathname); };
function draw() { const rows = rowsBut(null); drawRail(); drawSummary(rows); drawTable(rows); drawDetail(); sync(); }
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('.facet input[data-k]')) { const k = t.dataset.k, v = t.dataset.v; F[k] = t.checked ? [...F[k], v] : F[k].filter(x => x !== v); draw(); const a = document.querySelector(`.facet input[data-k="${k}"][data-v="${CSS.escape(v)}"]`); if (a) a.focus(); }
  else if (t.id === 'colPick') location.href = t.value;
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { F.q = e.target.value.trim().toLowerCase(); clearTimeout(draw.t); draw.t = setTimeout(() => { draw(); const q = $('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 150); }
  if (e.target.matches('.fq')) { const s = e.target.value.toLowerCase(); e.target.parentNode.querySelectorAll('.fo').forEach(o => { o.hidden = !o.textContent.toLowerCase().includes(s); }); }
});
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('.facet')) { UI.open[e.target.dataset.k] = e.target.open; saveUI(); } }, true);
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  const tr = !b && e.target.closest('tr.row');
  if (tr) { sel = sel === tr.dataset.card ? null : tr.dataset.card; drawDetail(); sync(); return; }
  if (!b) return;
  if (b.dataset.cur) { cur = b.dataset.cur; draw(); }
  else if (b.dataset.verdict) { const v = b.dataset.verdict; F.verdict = F.verdict.includes(v) ? F.verdict.filter(x => x !== v) : [...F.verdict, v]; draw(); }
  else if (b.hasAttribute('data-clear')) { F[b.dataset.clear] = []; draw(); }
  else if (b.hasAttribute('data-reset')) { FK.forEach(k => { F[k] = []; }); F.q = ''; draw(); }
  else if (b.classList.contains('sh')) { const k = b.dataset.k; Object.assign(st, st.def || st.k !== k ? { k, d: 1, def: false } : st.d > 0 ? { d: -1 } : { k: 'gap_all', d: 1, def: true }); draw(); }
  else if (b.hasAttribute('data-sortreset')) { Object.assign(st, { k: 'gap_all', d: 1, def: true }); draw(); }
  else if (b.hasAttribute('data-close')) { sel = null; drawDetail(); sync(); }
  else if (b.id === 'fopen') document.body.classList.toggle('fopen');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sel) { sel = null; drawDetail(); sync(); }
  const tr = e.key === 'Enter' && e.target.closest && e.target.closest('tr.row');
  if (tr) { sel = tr.dataset.card; drawDetail(); sync(); }
});
$('colPick').innerHTML = CFG.others.map(o => `<option value="${esc(o.href)}"${o.name === D.collection ? ' selected' : ''}>${esc(o.name)}${o.n ? ` (${o.n})` : ''}</option>`).join('');
$('mkt').href = CFG.market;
document.title = `JP vs EN Prices · ${D.collection}`;
$('sub').textContent = `${D.collection} · every Japanese print: the Japan sold price (Mercari) against the English card on TCGplayer`;
$('fxn').textContent = `¥1 = $${lastFx.toFixed(5)}`;
$('fx').textContent = `Prices to ${mon(D.months.at(-1))} · FX ${mon(Object.keys(D.fx).filter(k => D.fx[k]).at(-1))}${D.built ? ' · built ' + D.built : ''}`;
$('foot').innerHTML = '<b>How it is compared.</b> Japan = Mercari sold median (JP TCGplayer when Mercari has no sales), EN = TCGplayer for the matching finish. Under 0.8× = cheaper in Japan, over 1.25× = dearer. Flags: thin data (under 5 sales), the ¥300 Mercari floor, a match by name + set only. EN price history: <a href="https://tickermint.cards" target="_blank" rel="noopener">TickerMint</a> (Yuka Morii) and <a href="https://cardprice.com" target="_blank" rel="noopener">cardprice.com</a>; Japan: Mercari.';
draw();
})();

</script>
</body>
</html>
