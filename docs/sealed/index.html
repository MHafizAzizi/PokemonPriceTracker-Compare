:root{
    --on-accent:#fff;--on-lang:#fff;--lang-en:#2f6fdb;--lang-jp:#c0392b;--lang-cn:#8a5a12;--rar-u:#1d7a3a;--rar-r:#2f6fdb;--rar-g:#7a5400;--rar-gbg:#fff6d6;--rar-gold:#d4a300;--check-bg:#fdf3e1;--check-text:#8a5a00;--scan-bg:#fff;--fin-ink:#3d2f00;--fin-1:#ffe28a;--fin-2:#bfeaff;--fin-3:#ffd0a8;--fin-e1:#e0b400;--fin-e2:#38a8d8;--fin-e3:#e07a30;--print-ink:#1d1d1b;--print-line:#bbb;--print-muted:#888;--print-faint:#ddd;--shadow-0:var(--shadow-0);--shadow-1:rgb(0 0 0 / .13);--shadow-2:rgb(0 0 0 / .19);--shadow-3:rgb(0 0 0 / .31);--scrim:rgb(0 0 0 / .4);--backdrop:rgb(0 0 0 / .45);

}

  --bg:#141416;--surface:#1c1c1f;--text:#ececE8;--muted:#9a9a94;--line:#2e2e33;--accent:#6d9cff;
  --best-bg:#1d3626;--best-text:#7fd39a;--danger:#f2877f;--danger-bg:#3a2020;--fair-bg:#1f2738;
}}

    --on-accent:#0d1a33;--rar-u:#7fd39a;--rar-r:#6d9cff;--rar-g:#f0c850;--rar-gbg:#3a3010;--check-bg:#3a2e14;--check-text:#f0c870;
  --bg:#141416;--surface:#1c1c1f;--text:#ececE8;--muted:#9a9a94;--line:#2e2e33;--accent:#6d9cff;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font)}

html, body { overflow-x: clip; }

/* layout: Dark-Editorial sticky side rail + scrolling main */
.rail{position:sticky;top:0;height:100vh;padding:40px 28px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:28px}

.label{font-family:var(--font);font-size:12px;color:var(--muted); font-variant-numeric: tabular-nums}

/* 01 summary */
.kpi.deal b{color:var(--best-text)} .kpi.over b{color:var(--danger)}
.totals{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;margin-top:16px;padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.totals .big{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.totals .vs{color:var(--muted);font-size:14px}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:10px;background:var(--line)}

.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c)}

#eras{margin-top:40px}

.era,.set{font:inherit;color:inherit;text-align:left;cursor:pointer;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0;display:flex;flex-direction:column;gap:6px}

/* three columns */
#sellers{margin-top:48px}
.list{display:flex;flex-direction:column;gap:10px}

/* cost to complete */

.ct td.r b{font-weight:600}
/* sellers */
.dn{color:var(--best-text)} .up{color:var(--danger)}

/* 05 table */
.all{margin-top:48px}
#fSet{width:240px;max-width:100%;min-width:0;text-overflow:ellipsis} /* fixed: a select grows to its longest option (JP set names) */

/* All listings pager, above and below the table (user, 2026-11-11) */
.mpager{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 14px;margin:10px 0}
.mpager:empty{display:none}

.mpager .pg{font:13px var(--mono)}

.mpager .muted{flex-basis:100%;text-align:center;font-size:12px}

@media (max-width:820px){

/* facet rail (2026-11-09) */
/* Market report mock · facet rail (after the Tracker's direction 2) */
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.muted { color: var(--muted); }
.sp { flex: 1; }
.up { color: var(--danger); } .dn { color: var(--best-text); }
button { font: inherit; color: inherit; }
.linkish { border: 0; background: none; padding: 4px 2px; color: var(--accent); font-size: 13px; cursor: pointer; }

.mrail { position: sticky; top: 0; height: 100vh; overflow: auto; overscroll-behavior: contain; padding: 20px 16px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; background: var(--bg); }
.mrail > * { flex-shrink: 0; }   /* the rail is a scroller: nothing in it shrinks (a squeezed page switch went 2px tall, 2026-11-19) */

.pswitch { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.pswitch a { flex: 1; text-align: center; padding: 6px 2px; font-size: 12px; line-height: 1.3; color: var(--text); background: var(--surface); border-right: 1px solid var(--line); text-decoration: none; white-space: nowrap; }

.pswitch a[aria-disabled="true"] { color: var(--muted); opacity: .55; cursor: not-allowed; }
.colp { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }

.facet { border-top: 1px solid var(--line); padding: 8px 0; }

.sum { display: grid; grid-template-columns: minmax(260px, auto) 1fr; gap: 28px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; }

.split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--line); }
.split i { display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 8px; }

.it:hover { background: color-mix(in srgb, var(--line) 40%, transparent); }

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){ --e1:#a993ff; --e2:#f0a845; --e3:#7fd39a; --e4:#6d9cff; --e5:#f07aa8; }}

<body>
<a class="skip" href="#main">Skip to products</a>
<div class="mshell">
  <aside class="mrail" id="rail" aria-label="Pages and filters">
    <nav class="pswitch" id="pswitch" aria-label="Pages"></nav>
    <div class="seg2" role="group" aria-label="Currency"><button type="button" data-cur="rm">RM</button><button type="button" data-cur="usd">USD</button></div>
    <div id="facets"></div>
    <div class="fx mono" id="fx"></div>
  </aside>
  <button type="button" class="scrim" aria-label="Close filters" onclick="document.body.classList.remove('fopen')"></button>
  <main id="main">
    <header class="mhead"><div><h1>Sealed products</h1><p class="sub" id="sub"></p></div>
      <button type="button" id="fopen" class="fopen">Filters</button></header>
    <section id="eraS"><h2 class="h2">Price over time, by era<small>follows the filters</small></h2>
      <div class="panel"><div class="eleg" id="eraLegend"></div><div class="chart" id="eraChart"></div>
      <p class="note">Each line: median % change of that era's products since their first 4 sold weeks; products with 8+ sold weeks; a week without a sale keeps the last price. % because a tin and a box can't share a price axis.</p></div></section>
    <section id="all">
      <div class="tbar" id="tbar"><input type="search" id="q" placeholder="Search product or set… e.g. 151 elite" aria-label="Search sealed products" autocomplete="off"><span class="cnt" id="cnt" aria-live="polite"></span></div>
      <nav class="mpager" id="pgTop" aria-label="Product pages, top"></nav>
      <div class="tw"><table class="dt lt"><thead id="tHead"></thead><tbody id="tBody"></tbody></table></div>
      <nav class="mpager" id="pgBot" aria-label="Product pages, bottom"></nav>
    </section>
    <footer id="foot" class="foot"></footer>
  </main>
</div>
<button type="button" id="detScrim" aria-label="Close product" hidden></button>
<div id="det" role="dialog" aria-modal="true" aria-labelledby="detH" hidden></div>
<script src="sealed.js?v=d5e18cbeb0"></script>
<script>
// Sealed products page (2026-11-16, spec docs/superpowers/specs/2026-11-16-sealed-page-design.md): built for judging a local
// shop price. Data: data/sealed.js from scripts/sealed_prices.py (weekly TCGplayer sold prices, last 52 weeks, USD).
const D = typeof SEALED !== 'undefined' ? SEALED : { date: '', fx: { usd_myr: 4, date: '' }, products: [] };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = v => v.toLocaleString('en-US');
const median = v => { const s = [...v].sort((a, b) => a - b), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const mean = v => v.reduce((t, x) => t + x, 0) / v.length;

// ---------- prices ----------
// fair price = median of the last 4 sold weeks (one odd week can't set it); range = their low / high.
// Trend-aware (user, 2026-11-24): when all 4 weeks move the same way every week, the median lags, so the newest week is
// the fair price and `trend` says which way ('up' / 'down').
function fairOf(h) {
  h = h.filter(w => w[1] > 0);   // a $0 week is a data gap, not a price (sealed_prices.py drops them too)
  if (!h.length) return null;
  const last = h.slice(-4), p = last.map(w => w[1]), d = p.slice(1).map((v, i) => v - p[i]);
  const trend = p.length === 4 ? (d.every(x => x > 0) ? 'up' : d.every(x => x < 0) ? 'down' : undefined) : undefined;
  return { fair: trend ? p[3] : median(p), lo: Math.min(...p), hi: Math.max(...p), n: last.length, last: h[h.length - 1][0], trend };
}
const weeksAgo = (week, ref) => Math.round((Date.parse(ref) - Date.parse(week)) / 6048e5);
const STALE_WEEKS = 12;
const isStale = r => !!r.fairInfo && weeksAgo(r.fairInfo.last, D.date) > STALE_WEEKS;
// 52-week change: last 4 sold weeks vs first 4, needs 8+ (the Tracker's old rule)
const changeOf = h => (h.length >= 8 ? (mean(h.slice(-4).map(w => w[1])) / mean(h.slice(0, 4).map(w => w[1])) - 1) * 100 : null);
let UI = { cur: 'rm', open: { type: true, lang: true } };
try { UI = { ...UI, ...JSON.parse(localStorage.getItem('cpt-sealed-ui') || '{}') }; } catch (e) { /* fine */ }
const saveUI = () => { try { localStorage.setItem('cpt-sealed-ui', JSON.stringify(UI)); } catch (e) { /* fine */ } };
const money = usd => (usd == null ? '–' : UI.cur === 'usd' ? '$' + usd.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
  : 'RM ' + n(Math.round(usd * D.fx.usd_myr)));
const pct = p => (p == null ? '–' : (p > 0 ? '+' : '') + (Math.abs(p) >= 100 ? n(Math.round(p)) : p.toFixed(1)) + '%');

// verdict on the price you see, same thresholds as the market report (market_compare.py DEAL / OVER)
const DEAL = -15, OVER = 30;
function verdictOf(price, fair) { const p = (price / fair - 1) * 100; return { verdict: p <= DEAL ? 'deal' : p >= OVER ? 'overpriced' : 'fair', pct: p }; }
function parsePrice(text) {
  const s = String(text == null ? '' : text).replace(/rm|\$|,|\s/gi, '');
  if (!/^(\d+\.?\d*|\.\d+)$/.test(s)) return null;
  const v = Number(s); return v > 0 ? v : null;
}
const toCur = usd => (UI.cur === 'usd' ? usd : usd * D.fx.usd_myr);   // a USD price in the page's currency

let ROWS = null;
// fair price vs US launch MSRP (data/sealed_msrp.csv, hand table), in %; null without one of the two
const vsMsrpOf = (f, msrp) => (f && msrp ? (f.fair / msrp - 1) * 100 : null);
const rows = () => ROWS || (ROWS = D.products.map(p => { const fairInfo = fairOf(p.h);
  return { ...p, fairInfo, change: changeOf(p.h), sold: p.h.reduce((t, w) => t + w[2], 0), vsMsrp: vsMsrpOf(fairInfo, p.msrp) }; }));

// ---------- filters ----------
const ERA_ORDER = ['XY', 'Sun & Moon', 'Sword & Shield', 'Scarlet & Violet', 'Mega Evolution'];
const FK = ['era', 'type', 'set', 'lang'];
const F = { q: '', era: [], type: [], set: [], lang: [], sort: 'sold', dir: 'asc' };
const match = (r, skip) => FK.every(k => k === skip || !F[k].length || F[k].includes(r[k]))
  && (!F.q || F.q.split(/\s+/).every(w => (r.name + ' ' + r.set + ' ' + r.type + ' ' + r.era).toLowerCase().includes(w)));
// sort keys: natural order first ('asc'); 'desc' flips it; products without the sort value stay last either way
const SORTS = { sold: [r => r.sold, -1], cheapest: [r => (r.fairInfo ? r.fairInfo.fair : null), 1], rise: [r => r.change, -1], msrp: [r => r.vsMsrp, -1], name: [r => r.name, 1] };
function filtered() {
  const [get, d] = SORTS[F.sort] || SORTS.sold, s = F.dir === 'desc' ? -d : d;
  const out = rows().filter(r => match(r, null));
  const has = out.filter(r => get(r) != null && (F.sort !== 'sold' || r.h.length)), not = out.filter(r => !has.includes(r));
  has.sort((a, b) => { const x = get(a), y = get(b); return (typeof x === 'string' ? x.localeCompare(y) : x - y) * s || a.name.localeCompare(b.name); });
  return [...has, ...not.sort((a, b) => a.name.localeCompare(b.name))];
}
const FACETS = [
  ['era', 'Era', (a, b) => ERA_ORDER.indexOf(a) - ERA_ORDER.indexOf(b)],
  ['type', 'Type', null],
  ['set', 'Set', (a, b) => a.localeCompare(b)],
  ['lang', 'Language', (a, b) => ['EN', 'JP'].indexOf(a) - ['EN', 'JP'].indexOf(b), v => ({ EN: 'English', JP: 'Japanese' }[v] || v)],
];
function facet([key, label, order, lab = v => v]) {
  const m = new Map(); rows().filter(r => match(r, key)).forEach(r => m.set(r[key], (m.get(r[key]) || 0) + 1));
  const cur = F[key], vals = [...new Set([...m.keys(), ...cur])].sort(order || ((a, b) => (m.get(b) || 0) - (m.get(a) || 0) || a.localeCompare(b)));
  return `<details class="facet" data-k="${key}"${UI.open[key] ? ' open' : ''}><summary>${label}${cur.length ? `<span class="on">${cur.length}</span>` : ''}<small>${vals.length}</small></summary>
    ${vals.length > 12 ? `<input type="search" class="fq" placeholder="Search ${label.toLowerCase()}…" aria-label="Search ${label}" autocomplete="off">` : ''}
    <div class="fl" role="group" aria-label="${label}">${vals.map(v => { const c = m.get(v) || 0;
      return `<label class="fo${c ? '' : ' zero'}"><input type="checkbox" data-k="${key}" data-v="${esc(v)}"${cur.includes(v) ? ' checked' : ''}><span>${esc(lab(v))}</span><small>${n(c)}</small></label>`; }).join('')}</div>
    ${cur.length ? `<button type="button" class="linkish" data-clear="${key}">Clear</button>` : ''}</details>`;
}

// ---------- table ----------
const PAGE = 50; let page = 0;
const img = r => `<img class="th" loading="lazy" width="30" height="42" alt="" src="https://tcgplayer-cdn.tcgplayer.com/product/${encodeURIComponent(r.id)}_200w.jpg" onerror="this.style.visibility='hidden'">`;
function fairCell(r) {
  const f = r.fairInfo;
  if (!f) return '<td class="r fairc muted"><span class="sm">no recent sales</span></td>';
  const stale = isStale(r), thin = f.n < 4;
  const note = stale ? `last sold ${weeksAgo(f.last, D.date)} weeks ago` : thin ? `thin data, ${f.n} wk${f.n > 1 ? 's' : ''}`
    : f.trend ? `${f.trend === 'up' ? 'rising' : 'falling'}, newest week` : '';
  return `<td class="r fairc${stale || thin ? ' muted' : ''}"><b>${money(f.fair)}</b>${note ? `<div class="sm">${note}</div>` : ''}</td>`;
}
const TH = [['name', 'Product', ''], [null, 'Type', 'hs'], ['cheapest', 'Fair price', 'r'], ['msrp', 'MSRP', 'r hs'], [null, 'Range, 4 wks', 'r hs'], ['rise', '52 wks', 'r'], ['sold', 'Sold', 'r']];
const th = ([k, label, cls]) => { if (!k) return `<th class="${cls}">${label}</th>`; const on = F.sort === k;
  return `<th class="${cls}"${on ? ` aria-sort="${(SORTS[k][1] > 0) === (F.dir === 'asc') ? 'ascending' : 'descending'}"` : ''}><button type="button" class="sh${on ? ' on' : ''}" data-sort="${k}">${label}<span aria-hidden="true">${on ? (F.dir === 'asc' ? '↓' : '↑') : '↕'}</span></button></th>`; };
function drawTable(all) {
  const pages = Math.max(1, Math.ceil(all.length / PAGE)); page = Math.min(page, pages - 1);
  const from = page * PAGE, out = all.slice(from, from + PAGE);
  $('cnt').innerHTML = `<b>${n(all.length)}</b> of ${n(rows().length)} products`;
  const pager = all.length <= PAGE ? '' : `<button type="button" data-page="-1"${page === 0 ? ' disabled' : ''}>← Prev</button>
    <span class="pg">Page <select data-jump aria-label="Go to page">${Array.from({ length: pages }, (_, i) => `<option value="${i}"${i === page ? ' selected' : ''}>${i + 1}</option>`).join('')}</select> / ${pages}</span>
    <button type="button" data-page="1"${page >= pages - 1 ? ' disabled' : ''}>Next →</button><span class="muted">rows ${n(from + 1)}–${n(from + out.length)} of ${n(all.length)}</span>`;
  $('pgTop').innerHTML = $('pgBot').innerHTML = pager;
  $('tHead').innerHTML = `<tr><th class="img"><span class="vh">Image</span></th>${TH.map(th).join('')}</tr>`;
  $('tBody').innerHTML = out.map(r => `<tr data-id="${r.id}" tabindex="0"><td class="img">${img(r)}</td>
      <td class="card"><span class="cn">${esc(r.name)}</span><div class="sm">${esc(r.lang)} · ${esc(r.set)}</div></td>
      <td class="hs">${esc(r.type)}</td>${fairCell(r)}
      <td class="r num hs">${r.msrp ? `${money(r.msrp)}${r.vsMsrp != null ? `<div class="sm ${r.vsMsrp > 0 ? 'up' : 'dn'}">${pct(r.vsMsrp)}</div>` : ''}` : '<span class="sm muted">–</span>'}</td>
      <td class="r num hs sm">${r.fairInfo && r.fairInfo.n > 1 ? money(r.fairInfo.lo) + ' – ' + money(r.fairInfo.hi) : ''}</td>
      <td class="r num ${r.change > 0 ? 'up' : r.change < 0 ? 'dn' : ''}">${pct(r.change)}</td><td class="r num">${n(r.sold)}</td></tr>`).join('')
    || '<tr><td colspan="8" class="muted">No products match. <button type="button" class="linkish" data-reset>Reset filters</button></td></tr>';
}

// ---------- line chart (product drawer + era chart) ----------
// series: [{ color, cls?, name?, pts: [{ t (ms), y, note? }] }]; opt: { fmtY, fmtTip?, hline: { y, cls } , label }
// Hover / arrow keys (2026-11-19, user: "a pricing point when hovering on the trendline"): a guide line at the nearest
// week, a dot per line and a box with each line's value (fmtTip, else fmtY) and its note.
function lineChart(box, series, opt) {
  const all = series.flatMap(l => l.pts), ys = all.map(p => p.y).concat(opt.hline ? [opt.hline.y] : []);
  if (!all.length) { box.innerHTML = ''; return; }
  const W = Math.max(280, box.clientWidth || 400), H = opt.h || 220;
  const lo0 = Math.min(...ys), hi0 = Math.max(...ys), span = hi0 - lo0 || Math.abs(hi0) || 1;
  const pow = 10 ** Math.floor(Math.log10(span / 5)), step = [1, 2, 2.5, 5, 10].map(m => m * pow).find(x => span / x <= 5);
  const lo = Math.floor(lo0 / step) * step, hi = Math.ceil(hi0 / step) * step;
  const ticks = []; for (let v = lo; v <= hi + step / 2; v += step) ticks.push(v);
  const left = Math.max(...ticks.map(t => opt.fmtY(t).length)) * 7 + 10, right = 10, top = 8, bottom = 22;
  const t0 = Math.min(...all.map(p => p.t)), t1 = Math.max(...all.map(p => p.t));
  const x = t => left + (t - t0) / ((t1 - t0) || 1) * (W - left - right), y = v => top + (hi - v) / ((hi - lo) || 1) * (H - top - bottom);
  const months = []; for (const d = new Date(Date.UTC(new Date(t0).getUTCFullYear(), new Date(t0).getUTCMonth() + 1, 1)); d.getTime() <= t1; d.setUTCMonth(d.getUTCMonth() + (W < 480 ? 4 : 2))) months.push(d.getTime());
  const mf = new Intl.DateTimeFormat('en', { month: 'short', year: '2-digit', timeZone: 'UTC' });
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label)}">
    ${ticks.map(t => `<line x1="${left}" x2="${W - right}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${left - 6}" y="${y(t) + 4}" text-anchor="end">${opt.fmtY(t)}</text>`).join('')}
    ${months.map(t => `<text x="${x(t)}" y="${H - 6}" text-anchor="middle">${mf.format(t)}</text>`).join('')}
    ${opt.hline ? `<line class="${opt.hline.cls}" x1="${left}" x2="${W - right}" y1="${y(opt.hline.y)}" y2="${y(opt.hline.y)}" stroke="${opt.hline.color || 'var(--text)'}" stroke-width="1.5" stroke-dasharray="5 4"/>` : ''}
    ${series.map(l => `<polyline class="${l.cls || ''}" fill="none" stroke="${l.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${l.pts.map(p => x(p.t).toFixed(1) + ',' + y(p.y).toFixed(1)).join(' ')}"/>`).join('')}
    <g class="hov" style="display:none"><line y1="${top}" y2="${H - bottom}"/>${series.map(l => `<circle r="4" fill="${l.color}"/>`).join('')}</g></svg><div class="ctip" hidden></div>`;
  const svg = box.querySelector('svg'), g = svg.querySelector('.hov'), tip = box.querySelector('.ctip'), dots = g.querySelectorAll('circle');
  const times = [...new Set(all.map(p => p.t))].sort((a, b) => a - b), df = new Intl.DateTimeFormat('en', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
  const near = (pts, t) => pts.reduce((b, p) => (Math.abs(p.t - t) < Math.abs(b.t - t) ? p : b), pts[0]);
  let at = -1;
  const show = i => {
    at = Math.max(0, Math.min(times.length - 1, i)); const t = times[at], X = x(t);
    g.style.display = ''; g.querySelector('line').setAttribute('x1', X); g.querySelector('line').setAttribute('x2', X);
    const rows = series.map((l, k) => { const p = l.pts.length ? near(l.pts, t) : null;
      if (p) { dots[k].setAttribute('cx', x(p.t)); dots[k].setAttribute('cy', y(p.y)); dots[k].style.display = ''; } else dots[k].style.display = 'none';
      return p ? `<div><i style="background:${l.color}"></i>${l.name ? esc(l.name) + ' ' : ''}<strong>${esc((opt.fmtTip || opt.fmtY)(p.y))}</strong>${p.note ? ` <small>${esc(p.note)}</small>` : ''}</div>` : ''; }).join('');
    tip.innerHTML = `<b>${df.format(t)}</b>${rows}`; tip.hidden = false;
    const k = box.clientWidth / W, px = X * k, w = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(box.clientWidth - w, px + 12 + w > box.clientWidth ? px - w - 12 : px + 12)) + 'px';
  };
  const hide = () => { g.style.display = 'none'; tip.hidden = true; };
  svg.setAttribute('tabindex', '0');
  svg.addEventListener('pointermove', e => { const r = svg.getBoundingClientRect(), t = t0 + ((e.clientX - r.left) * W / r.width - left) / ((W - left - right) || 1) * ((t1 - t0) || 1);
    let i = 0; times.forEach((v, j) => { if (Math.abs(v - t) < Math.abs(times[i] - t)) i = j; }); show(i); });
  svg.addEventListener('pointerleave', () => { if (document.activeElement !== svg) hide(); });
  svg.addEventListener('focus', () => show(at < 0 ? times.length - 1 : at));
  svg.addEventListener('blur', hide);
  svg.addEventListener('keydown', e => { const d = { ArrowLeft: -1, ArrowRight: 1, Home: -1e9, End: 1e9 }[e.key]; if (d) { e.preventDefault(); show(at + d); } else if (e.key === 'Escape') svg.blur(); });
}

// ---------- era compare chart ----------
// one line per era: median % change of its products (8+ sold weeks) on a weekly grid; baseline = mean of a product's
// first 4 sold weeks; a product counts from its first sold week; a week without a sale carries its last price
const ERA_COLOR = { XY: 'var(--e1)', 'Sun & Moon': 'var(--e2)', 'Sword & Shield': 'var(--e3)', 'Scarlet & Violet': 'var(--e4)', 'Mega Evolution': 'var(--e5)' };
function eraSeries(rs) {
  const q = rs.filter(r => r.h.length >= 8);
  if (!q.length) return [];
  const ts = q.flatMap(r => [Date.parse(r.h[0][0]), Date.parse(r.h[r.h.length - 1][0])]), t0 = Math.min(...ts), t1 = Math.max(...ts);
  const grid = []; for (let t = t0; t <= t1; t += 6048e5) grid.push(t);
  const eras = [...new Set(q.map(r => r.era))].sort((a, b) => (ERA_ORDER.indexOf(a) + 1 || 99) - (ERA_ORDER.indexOf(b) + 1 || 99));
  return eras.map(era => {
    const ps = q.filter(r => r.era === era).map(r => ({ base: mean(r.h.slice(0, 4).map(w => w[1])), h: r.h.map(w => [Date.parse(w[0]), w[1]]) }));
    const pts = [];
    grid.forEach(t => {
      const v = [], pr = []; ps.forEach(p => { let last = null; for (const w of p.h) { if (w[0] > t + 1e6) break; last = w[1]; } if (last != null) { v.push((last / p.base - 1) * 100); pr.push(last); } });
      if (v.length) pts.push({ date: new Date(t).toISOString().slice(0, 10), t, pct: median(v), price: median(pr), n: v.length });
    });
    return { era, n: ps.length, pts };
  });
}
function drawEra(all) {
  const ser = eraSeries(all);
  $('eraLegend').innerHTML = ser.map(s => `<span class="chip"><i style="background:${ERA_COLOR[s.era] || 'var(--muted)'}"></i>${esc(s.era)} <small>(${n(s.n)})</small></span>`).join('');
  if (!ser.length) { $('eraChart').innerHTML = '<div class="empty">Not enough sales in this filter (needs products with 8+ sold weeks).</div>'; return; }
  // hover note: the era's median sold price that week (the products in the filter), so a Type filter gives a real price
  lineChart($('eraChart'), ser.map(s => ({ color: ERA_COLOR[s.era] || 'var(--muted)', name: s.era, pts: s.pts.map(p => ({ t: p.t, y: p.pct, note: `median ${fmtCur(toCur(p.price))}, ${n(p.n)} products` })) })),
    { fmtY: v => (v > 0 ? '+' : '') + Math.round(v) + '%', fmtTip: v => (v > 0 ? '+' : '') + v.toFixed(1) + '%', label: 'Median price change by era', h: 240, hline: { y: 0, cls: 'zero', color: 'var(--muted)' } });
}

// ---------- product drawer: price check ----------
let detId = null, detFrom = null;
// whole units from 100 up, cents below (a RM 9 pack can't be judged in whole ringgit)
const fmtCur = v => { const d = Math.abs(v) < 100 ? 2 : 0, t = v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); return UI.cur === 'usd' ? '$' + t : 'RM ' + t; };
// zone edges rounded outward (down for Deal, up for Overpriced) so a typed label price gets that label's verdict
function zoneEdges(fairC) { const s = Math.abs(fairC) < 100 ? 100 : 1, r = v => Math.round(v * 100) / 100;
  return { deal: r(Math.floor(fairC * 0.85 * s + 1e-9) / s), over: r(Math.ceil(fairC * 1.3 * s - 1e-9) / s) }; }
function openDet(id) {
  const r = rows().find(x => x.id === Number(id)); if (!r) return;
  detId = r.id; detFrom = document.activeElement;
  const f = r.fairInfo, stale = isStale(r);
  const when = f ? (stale ? `last sold ${weeksAgo(f.last, D.date)} weeks ago · old data, check eBay` : f.n < 4 ? `thin data: ${f.n} sold week${f.n > 1 ? 's' : ''}` : `last sold week of ${f.last}${f.trend ? ` · ${f.trend === 'up' ? 'rising' : 'falling'} 4 weeks in a row, so fair = newest week` : ''}`) : '';
  $('det').innerHTML = `<button type="button" id="detClose" aria-label="Close">×</button>
    <img class="dimg" alt="" src="https://tcgplayer-cdn.tcgplayer.com/product/${encodeURIComponent(r.id)}_200w.jpg" onerror="this.remove()">
    <h2 id="detH">${esc(r.name)}</h2><div class="sm">${esc(r.lang)} · ${esc(r.set)} · ${esc(r.type)} · ${esc(r.era)}</div>
    ${f ? `<div class="dfair">Fair price<b>${money(f.fair)}</b>${f.n > 1 ? `range ${money(f.lo)} – ${money(f.hi)}, ` : ''}${n(r.sold)} sold in 52 weeks${r.msrp ? `<div class="dnote">${r.msrp_jpy ? `JP MSRP ¥${n(r.msrp_jpy)} (${money(r.msrp)} today)` : `US MSRP ${money(r.msrp)}`}, fair price ${pct(r.vsMsrp)} vs MSRP</div>` : ''}<div class="dnote">${when}</div></div>
    <label class="pbox" for="price">Price you see <span>${UI.cur === 'usd' ? '$' : 'RM'}</span><input id="price" inputmode="decimal" autocomplete="off" placeholder="${Math.round(toCur(f.fair))}"></label>
    <div id="zone" style="--z1:${zpos(0.85)}%;--z2:${zpos(1.3)}%"><span class="mark" hidden></span></div>
    <div class="zl"><span>Deal ≤ ${fmtCur(zoneEdges(toCur(f.fair)).deal)}</span><span>Fair</span><span>Overpriced ≥ ${fmtCur(zoneEdges(toCur(f.fair)).over)}</span></div>
    <p id="verdict" aria-live="polite"></p>` : '<p class="dfair">No recent sales on TCGplayer in the last 52 weeks, so no fair price. Check eBay.</p><p id="verdict"></p>'}
    <div class="chart" id="detChart"></div>
    <p class="dnote"><a href="https://www.tcgplayer.com/product/${encodeURIComponent(r.id)}" target="_blank" rel="noopener">TCGplayer product page ↗</a></p>`;
  $('det').hidden = $('detScrim').hidden = false;
  document.querySelector('.mshell').inert = true;   // aria-modal: Tab stays in the drawer
  document.querySelectorAll('#tBody tr').forEach(t => t.setAttribute('aria-selected', t.dataset.id === String(r.id)));
  checkPrice();
  ($('price') || $('detClose')).focus();
}
// zone bar: fair × 0.6 .. fair × 1.6 on a straight scale
const zpos = ratio => Math.max(0, Math.min(100, (ratio - 0.6) * 100));
function checkPrice() {
  const r = rows().find(x => x.id === detId); if (!r) return;
  const f = r.fairInfo, box = $('price'), price = box ? parsePrice(box.value) : null, v = $('verdict');
  const fairC = f ? toCur(f.fair) : null, mark = document.querySelector('#zone .mark');
  if (f && price) {
    const res = verdictOf(price, fairC), lab = { deal: 'Deal', fair: 'Fair', overpriced: 'Overpriced' }[res.verdict];
    v.className = isStale(r) || f.n < 4 ? 'muted' : '';
    v.innerHTML = `<span class="badge ${{ deal: 'b-deal', fair: 'b-fair', overpriced: 'b-over' }[res.verdict]}">${lab}</span>${fmtCur(price)} is ${pct(res.pct)} vs fair ${fmtCur(fairC)}${isStale(r) ? ' · old data, check eBay' : f.n < 4 ? ' · thin data' : ''}`;
    mark.hidden = false; mark.style.left = zpos(price / fairC) + '%';
  } else { v.className = ''; v.innerHTML = ''; if (mark) mark.hidden = true; }
  lineChart($('detChart'), r.h.length ? [{ color: 'var(--accent)', pts: r.h.map(w => ({ t: Date.parse(w[0]), y: toCur(w[1]) })) }] : [],
    { fmtY: fmtCur, label: `Weekly sold price of ${r.name}`, hline: f && price ? { y: price, cls: 'typed' } : null });
}
function closeDet() {
  $('det').hidden = $('detScrim').hidden = true; detId = null;
  document.querySelector('.mshell').inert = false;
  document.querySelectorAll('#tBody tr[aria-selected]').forEach(t => t.removeAttribute('aria-selected'));
  if (detFrom && document.contains(detFrom)) detFrom.focus();
}

function render() {
  const all = filtered();
  const nOn = FK.filter(k => F[k].length).length;
  $('facets').innerHTML = `<div class="fh"><h2>Filters</h2>${nOn || F.q ? '<button type="button" class="linkish" data-reset>Reset all</button>' : ''}</div>${FACETS.map(facet).join('')}`;
  $('fopen').textContent = 'Filters' + (nOn ? ' · ' + nOn : '');
  document.querySelectorAll('[data-cur]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cur === UI.cur));
  if ($('q').value.trim().toLowerCase() !== F.q) $('q').value = F.q;
  const sold = rows().filter(r => r.h.length).length;
  $('sub').textContent = `Fair price = median of the last 4 sold weeks on TCGplayer (newest week when they rise or fall every week). ${n(rows().length)} products, ${n(sold)} with recent sales.`;
  drawTable(all);
  drawEra(all);
}
// page switch (2026-11-16): the Tracker remembers the last collection (cpt-col) and its JP vs EN page (cpt-jpen)
(function () {
  const PAGES = /\/sealed\//.test(location.pathname);   // docs/sealed/ on GitHub Pages, Tracker/sealed.html on the PC
  let col = '', jp = '';
  try { col = localStorage.getItem('cpt-col') || ''; jp = localStorage.getItem('cpt-jpen') || ''; } catch (e) { /* defaults */ }
  if (PAGES && jp) jp = '../' + jp;
  const seg = (label, href, cur) => (cur ? `<a aria-current="page" href="">${label}</a>` : href ? `<a href="${esc(href)}">${label}</a>` : `<a aria-disabled="true">${label}</a>`);
  $('pswitch').innerHTML = seg('Cards', PAGES ? '../' : 'index.html') + seg('Market', (PAGES ? '../market/' : 'market_report.html') + (col ? '?collection=' + encodeURIComponent(col) : ''))
    + seg('JP vs EN', jp) + seg('Sealed', '', true);
})();
$('fx').textContent = `TCGplayer sold prices to ${D.date}, USD 1 = RM ${D.fx.usd_myr.toFixed(2)} (${D.fx.date})`;
$('foot').innerHTML = '<b>How it is priced.</b> Weekly TCGplayer market price of each unopened product (last 52 weeks), the same source as the product page chart. Fair price = median of the last 4 weeks with sales, or the newest week when those 4 rise or fall every week; range = their lowest and highest week. 52 wks = last 4 sold weeks against the first 4, shown with 8+ sold weeks. MSRP = launch retail price from official and retailer announcements: US MSRP for EN, Japanese MSRP (tax included) for JP at the current yen rate (– = not found yet); the % under it is the fair price against it.';

// ---------- events ----------
const redraw = () => { page = 0; render(); };
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('.facet input[data-k]')) { const k = t.dataset.k, v = t.dataset.v; F[k] = t.checked ? [...F[k], v] : F[k].filter(x => x !== v);
    if (k === 'era' && F.era.length) F.set = F.set.filter(s => rows().some(r => r.set === s && F.era.includes(r.era)));   // eras narrow the Set list
    redraw(); const again = document.querySelector(`.facet input[data-k="${k}"][data-v="${CSS.escape(v)}"]`); if (again) again.focus(); }
  else if (t.matches('select[data-jump]')) { page = Number(t.value); render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'price') checkPrice();
  if (e.target.id === 'q') { clearTimeout(render.t); render.t = setTimeout(() => { F.q = e.target.value.trim().toLowerCase(); redraw(); }, 150); }
  if (e.target.matches('.fq')) { const s = e.target.value.toLowerCase(); e.target.parentNode.querySelectorAll('.fo').forEach(o => { o.hidden = !o.textContent.toLowerCase().includes(s); }); }
});
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('.facet')) { UI.open[e.target.dataset.k] = e.target.open; saveUI(); } }, true);
document.addEventListener('click', e => {
  const tr = e.target.closest('#tBody tr[data-id]');
  if (tr && !e.target.closest('a, button')) { openDet(tr.dataset.id); return; }
  const b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'detClose' || b.id === 'detScrim') { closeDet(); return; }
  if (b.dataset.clear) { F[b.dataset.clear] = []; redraw(); }
  else if (b.hasAttribute('data-reset')) { FK.forEach(k => { F[k] = []; }); F.q = ''; redraw(); }
  else if (b.dataset.cur) { UI.cur = b.dataset.cur; saveUI(); render(); if (detId) openDet(detId); }   // a typed price was in the other currency: start empty
  else if (b.dataset.sort) { const k = b.dataset.sort; if (F.sort === k) F.dir = F.dir === 'asc' ? 'desc' : 'asc'; else { F.sort = k; F.dir = 'asc'; } redraw(); }
  else if (b.dataset.page) { page += Number(b.dataset.page); render(); }
  else if (b.id === 'fopen') document.body.classList.toggle('fopen');
});
addEventListener('resize', () => { clearTimeout(drawEra.t); drawEra.t = setTimeout(() => { drawEra(filtered()); if (detId) checkPrice(); }, 150); });   // charts are drawn to the box width
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && detId) closeDet();
  else if (e.key === 'Enter' && e.target.matches('#tBody tr[data-id]')) openDet(e.target.dataset.id);
});
render();
</script>
</body>
